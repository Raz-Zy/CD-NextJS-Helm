apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-nextjs-deployment
  labels:
    app: nextjs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      containers:
        - name: nextjs
          image: razzy10/nextjs-app-image:0.0.15
          ports:
            - containerPort: 3000