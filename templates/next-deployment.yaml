apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-nextjs-deployment
  labels:
    app: nextjs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      containers:
        - name: nextjs
          image: "{{ .Values.image.imageRepository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 150m
              memory: 300Mi
            limits:
              cpu: 500m
              memory: 512Mi